spack:
  packages:
    all:
      providers:
        mpi: [intel-oneapi-mpi]
    netcdf-c:
      require: '%intel'
    netcdf-fortran:
      require: '%intel'
    bacio:
      require: '%intel'
    g2:
      require: '%intel'
    metis:
      require: '%intel'
    parmetis:
      require: '%intel'
    scotch:
      require: '%intel'
    jasper:
      require: '%intel'
    w3emc:
      require: '%intel'
    parallelio:
      require: '%intel'
    esmf:
      require: '%intel'
    intel-oneapi-mpi:
      require: '%intel'
    python:
      require: '%gcc'
    py-pyyaml:
      require: '%gcc'
    gcc-runtime:
      require: '%gcc'
  specs:
  - netcdf-c@4.9.2~dap
  - netcdf-fortran@4.6.1
  - bacio@2.4.1
  - g2@3.4.5
  - metis@5.1.0~shared
  - parmetis@4.0.3~shared
  - scotch@7.0.1+mpi+metis~shared
  - jasper@2.0.32
  - w3emc@2.9.2
  - parallelio@2.5.9+fortran~pnetcdf
  - esmf@8.4.2~debug~xerces+external-parallelio
  - intel-oneapi-mpi %intel
  view: true
  concretizer:
    unify: when_possible
